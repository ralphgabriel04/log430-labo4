name: CI/CD

# Pipeline CI/CD du Store Manager (Labo 4)
# 1. test          : lance la suite pytest contre des services MySQL + Redis
# 2. build-and-push: construit l'image Docker et la pousse sur GHCR
# 3. deploy        : déploiement automatisé par SSH sur les VMs (load balancing)
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1) TESTS
  # ---------------------------------------------------------------------------
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: labo04_db
          MYSQL_USER: labo04
          MYSQL_PASSWORD: labo04
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Creer fichier .env
        run: |
          {
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_NAME=labo04_db"
            echo "DB_USER=labo04"
            echo "DB_PASSWORD=labo04"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=6379"
            echo "REDIS_DB=0"
          } > .env

      - name: Installer le client MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Initialiser le schema de la base de donnees
        run: mysql -h 127.0.0.1 -u root -proot labo04_db < db-init/00_init.sql

      - name: Run tests
        working-directory: src
        run: python -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # 2) BUILD + PUSH de l'image Docker (conteneurisation)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push image Docker (GHCR)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/store_manager
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3) DEPLOIEMENT automatise (les 2 VMs derriere NGINX)
  # ---------------------------------------------------------------------------
  # S'execute uniquement sur push vers main. Necessite les secrets :
  #   VM_SSH_USER, VM_SSH_KEY  (cle privee SSH)
  # et, pour atteindre le reseau prive ETS (10.194.x.x), un runner self-hosted
  # OU un acces VPN. Voir RAPPORT.md (Activite 8).
  deploy:
    name: Deploiement SSH sur les VMs
    needs: build-and-push
    # Active uniquement quand la variable de depot ENABLE_DEPLOY = true ET que les
    # secrets VM_SSH_USER / VM_SSH_KEY sont configures (sinon le job est ignore,
    # ce qui garde le pipeline vert tant qu'on n'a pas d'acces VPN aux VMs ETS).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        host: ["10.194.32.67", "10.194.32.68"]
    steps:
      - name: Deploy sur ${{ matrix.host }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ matrix.host }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/log430-labo4
            git pull --ff-only
            docker compose pull
            docker compose up -d --build
            docker compose ps
